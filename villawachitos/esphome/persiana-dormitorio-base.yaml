# Paquete compartido de las persianas de dormitorio (incluir junto a persiana-base.yaml).
# Pines: relés persiana (persiana-base) GPIO16/GPIO17; relés luz relay_light_techo=GPIO18, relay_light_mesita=GPIO19;
# botones button_1..button_4 = GPIO33, GPIO26, GPIO14, GPIO13.

switch:
  - platform: gpio
    pin: GPIO18
    id: relay_light_techo
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Techo"
  - platform: gpio
    pin: GPIO19
    id: relay_light_mesita
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Mesita"

script:
  - id: dimming_up_loop
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: button_4
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_up
                data:
                  device: dormitorio_2
                  button: button_4
                  gesture: dimming_up
            - script.execute: dimming_up_loop

  - id: dimming_down_loop
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: button_4
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_down
                data:
                  device: dormitorio_2
                  button: button_4
                  gesture: dimming_down
            - script.execute: dimming_down_loop

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO33
      mode:
        input: true
        pulldown: true
    id: button_1
    name: "Button 1"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - script.execute: toggle_button_up
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 50ms
        then:
          - script.execute: set_button_up_60

  - platform: gpio
    pin:
      number: GPIO26
      mode:
        input: true
        pulldown: true
    id: button_2
    name: "Button 2"
    on_press:
      - switch.toggle: relay_light_techo

  - platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pulldown: true
    id: button_3
    name: "Button 3"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - script.execute: toggle_button_down
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 50ms
        then:
          - script.execute: set_button_down_30

  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pulldown: true
    id: button_4
    name: "Button 4"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - switch.toggle: relay_light_mesita
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_double_click
              data:
                device: dormitorio_2
                button: button_4
                gesture: double_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - if:
              condition:
                switch.is_off: relay_light_mesita
              then:
                - switch.toggle: relay_light_mesita
              else:
                - homeassistant.event:
                    event: esphome.jung_single_click
                    data:
                      device: dormitorio_2
                      button: button_4
                      gesture: single_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for at least 800ms
        then:
          - script.stop: dimming_up_loop
          - script.execute: dimming_down_loop
    on_press:
      - script.execute: dimming_up_loop
    on_release:
      - script.stop: dimming_up_loop
      - script.stop: dimming_down_loop
