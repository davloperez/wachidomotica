# @esphome-device
# Cocina Configuration

esphome:
  name: esp-cocina

packages:
  common: !include common.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 20.0dB

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: "platano+1234"
    ssid: "AP-Cocina"

switch:
  - platform: gpio
    pin: GPIO19
    id: relay_light_techo_barra_cocina
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Techo Barra Cocina"
  - platform: gpio
    pin: GPIO21
    id: relay_light_isla_cocina
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Isla Cocina"
  - platform: gpio
    pin: GPIO22
    id: relay_light_techo_cocina
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Techo Cocina"

script:
  - id: dimming_up_loop_boton_2
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: boton_2_jung_cocina
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_up
                data:
                  device: cocina
                  button: button_2
                  gesture: dimming_up
            - script.execute: dimming_up_loop_boton_2

  - id: dimming_down_loop_boton_2
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: boton_2_jung_cocina
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_down
                data:
                  device: cocina
                  button: button_2
                  gesture: dimming_down
            - script.execute: dimming_down_loop_boton_2

  - id: dimming_up_loop_boton_8
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: boton_8_jung_cocina
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_up
                data:
                  device: cocina
                  button: button_8
                  gesture: dimming_up
            - script.execute: dimming_up_loop_boton_8

  - id: dimming_down_loop_boton_8
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: boton_8_jung_cocina
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_down
                data:
                  device: cocina
                  button: button_8
                  gesture: dimming_down
            - script.execute: dimming_down_loop_boton_8

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO32
      mode:
        input: true
        pulldown: true
    id: boton_2_jung_cocina
    name: "Botón 2 Jung Cocina"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_double_click
              data:
                device: cocina
                button: button_2
                gesture: double_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_single_click
              data:
                device: cocina
                button: button_2
                gesture: single_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for at least 800ms
        then:
          - script.stop: dimming_up_loop_boton_2
          - script.execute: dimming_down_loop_boton_2
    on_press:
      - script.execute: dimming_up_loop_boton_2
    on_release:
      - script.stop: dimming_up_loop_boton_2
      - script.stop: dimming_down_loop_boton_2
  - platform: gpio
    pin:
      number: GPIO26
      mode:
        input: true
        pulldown: true
    id: boton_4_jung_cocina
    name: "Botón 4 Jung Cocina"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      then:
        - switch.toggle: relay_light_isla_cocina
  - platform: gpio
    pin:
      number: GPIO25
      mode:
        input: true
        pulldown: true
    id: boton_5_jung_cocina
    name: "Botón 5 Jung Cocina"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      then:
        - switch.toggle: relay_light_techo_cocina
  - platform: gpio
    pin:
      number: GPIO15
      mode:
        input: true
        pulldown: true
    id: boton_6_jung_cocina
    name: "Botón 6 Jung Cocina"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - switch.turn_on: relay_light_techo_barra_cocina
    on_release:
      then:
        - switch.turn_off: relay_light_techo_barra_cocina
  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pulldown: true
    id: boton_8_jung_cocina
    name: "Botón 8 Jung Cocina"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_double_click
              data:
                device: cocina
                button: button_8
                gesture: double_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_single_click
              data:
                device: cocina
                button: button_8
                gesture: single_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for at least 800ms
        then:
          - script.stop: dimming_up_loop_boton_8
          - script.execute: dimming_down_loop_boton_8
    on_press:
      - script.execute: dimming_up_loop_boton_8
    on_release:
      - script.stop: dimming_up_loop_boton_8
      - script.stop: dimming_down_loop_boton_8
