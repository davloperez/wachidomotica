# @esphome-device
# Persiana Dormitorio 1 Configuration
# Imports shared logic from persiana-base.yaml

substitutions:
  device_id: "2"
  open_duration: "23" # Tiempo para subir (segundos)
  close_duration: "22" # Tiempo para bajar (segundos)

esphome:
  name: persiana-dormitorio-1

packages:
  base: !include persiana-base.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 20.0dB

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: "platano+1234"
    ssid: "AP-Persiana-Dormitorio-1"

switch:
  # ====== CEILING LIGHT (existing relay) ======
  - platform: gpio
    pin: GPIO18
    id: relay_light_techo_dormitorio_1
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Techo Dormitorio 1"
  - platform: gpio
    pin: GPIO19
    id: relay_light_mesita_dormitorio_1
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Mesita Dormitorio 1"
  - platform: gpio
    pin: GPIO21
    id: relay_light_techo_vestidor
    restore_mode: ALWAYS_OFF
    inverted: True
    name: "Luz Techo Vestidor"

script:
  - id: dimming_up_loop_dormitorio_1
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: boton_4_jung_dormitorio_1
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_up
                data:
                  device: dormitorio_1
                  button: button_4
                  gesture: dimming_up
            - script.execute: dimming_up_loop_dormitorio_1

  - id: dimming_down_loop_dormitorio_1
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: boton_4_jung_dormitorio_1
          then:
            - homeassistant.event:
                event: esphome.jung_dimming_down
                data:
                  device: dormitorio_1
                  button: button_4
                  gesture: dimming_down
            - script.execute: dimming_down_loop_dormitorio_1

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO33
      mode:
        input: true
        pulldown: true
    id: boton_1_jung_dormitorio_1
    name: "Botón 1 Jung Dormitorio 1"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - script.execute: toggle_button_up
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 50ms
        then:
          - script.execute: set_button_up_60

  - platform: gpio
    pin:
      number: GPIO32
      mode:
        input: true
        pulldown: true
    id: boton_2_jung_dormitorio_1
    name: "Botón 2 Jung Dormitorio 1"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_single_click
              data:
                device: dormitorio_1
                button: button_2
                gesture: single_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_double_click
              data:
                device: dormitorio_1
                button: button_2
                gesture: double_click

  - platform: gpio
    pin:
      number: GPIO26
      mode:
        input: true
        pulldown: true
    id: boton_3_jung_dormitorio_1
    name: "Botón 3 Jung Dormitorio 1"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - script.execute: toggle_button_down
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 50ms
        then:
          - script.execute: set_button_down_30

  - platform: gpio
    pin:
      number: GPIO25
      mode:
        input: true
        pulldown: true
    id: boton_4_jung_dormitorio_1
    name: "Botón 4 Jung Dormitorio 1"
    on_multi_click:
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - switch.toggle: relay_light_mesita_dormitorio_1
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - homeassistant.event:
              event: esphome.jung_double_click
              data:
                device: dormitorio_1
                button: button_4
                gesture: double_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for at least 350ms
        then:
          - if:
              condition:
                switch.is_off: relay_light_mesita_dormitorio_1
              then:
                - switch.toggle: relay_light_mesita_dormitorio_1
              else:
                - homeassistant.event:
                    event: esphome.jung_single_click
                    data:
                      device: dormitorio_1
                      button: button_4
                      gesture: single_click
      - timing:
          - ON for 50ms to 350ms
          - OFF for 50ms to 350ms
          - ON for at least 800ms
        then:
          - script.stop: dimming_up_loop_dormitorio_1
          - script.execute: dimming_down_loop_dormitorio_1
    on_press:
      - script.execute: dimming_up_loop_dormitorio_1
    on_release:
      - script.stop: dimming_up_loop_dormitorio_1
      - script.stop: dimming_down_loop_dormitorio_1

  - platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pulldown: true
    id: boton_6_jung_dormitorio_1
    name: "Botón 6 Jung Dormitorio 1"
    on_press:
      - switch.toggle: relay_light_techo_vestidor

  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pulldown: true
    id: boton_8_jung_dormitorio_1
    name: "Botón 8 Jung Dormitorio 1"
    on_press:
      - switch.toggle: relay_light_techo_dormitorio_1
