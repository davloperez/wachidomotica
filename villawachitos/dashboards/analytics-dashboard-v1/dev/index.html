<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics Dashboard v1 · dev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060c;
      }
      #devbar {
        position: fixed;
        z-index: 10;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font:
          12px/1 system-ui,
          sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        padding: 6px 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        opacity: 0.35;
        transition: opacity 200ms;
      }
      #devbar:hover {
        opacity: 1;
      }
      #devbar button {
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <analytics-dashboard-v1></analytics-dashboard-v1>
    <div id="devbar">
      <span id="mode"></span>
      <button id="toggle-ha-dark">HA dark mode: <b id="ha-dark"></b></button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
